<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#16151b">
  <title>Afterlight — Cover Studio</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="src/cover.js"></script>
  <script defer src="src/scenes.js"></script>
  <script defer src="src/main.js"></script>
</head>
<body>
  <header class="masthead">
    <div class="brand"><span class="mark" aria-hidden="true"></span><div><h1>AFTERLIGHT</h1><span>Cover Studio</span></div></div>
    <button id="export" class="primary" type="button">Download PNG <span aria-hidden="true">↓</span></button>
  </header>
  <main class="workspace">
    <section class="preview" aria-labelledby="preview-label">
      <div class="stage-bar"><h2 id="preview-label">Live preview</h2><output id="dimensions"></output></div>
      <div class="stage"><canvas id="poster" aria-label="Poster preview. Drag a photo to reposition it."></canvas></div>
      <p class="stage-help">Select a panel, then drag its photo to reframe.</p>
    </section>
    <aside class="inspector" aria-label="Poster settings">
      <section>
        <h2>Composition</h2>
        <div class="options" id="formats" aria-label="Export size">
          <button data-size="square">Square</button><button data-size="portrait">Portrait</button><button data-size="wide">Wide</button>
        </div>
        <label for="layout">Layout</label>
        <select id="layout"><option value="mosaic">Four-panel mosaic</option><option value="split">Two-panel split</option><option value="strip">Three-panel triptych</option></select>
      </section>
      <section>
        <h2>Photos</h2>
        <div id="panels" class="options panels" aria-label="Photo panels"></div>
        <input id="file" type="file" accept="image/*" hidden>
        <div class="photo-actions"><button id="upload">Replace photo</button><button id="reset">Reset crop</button></div>
        <div class="ranges">
          <label for="zoom">Zoom</label><input id="zoom" type="range" min="1" max="4" step=".01">
          <label for="x">Horizontal</label><input id="x" type="range" min="-1" max="1" step=".01">
          <label for="y">Vertical</label><input id="y" type="range" min="-1" max="1" step=".01">
        </div>
      </section>
      <section>
        <h2>Caption &amp; color</h2>
        <label for="caption">Title</label>
        <input id="caption" type="text" maxlength="48" value="MIDNIGHT COAST">
        <label for="subtitle">Subtitle</label>
        <input id="subtitle" type="text" maxlength="64" value="LAST EXIT BEFORE DAWN">
        <div class="options grades" id="grades" aria-label="Color grade">
          <button data-grade="sunset">Sunset</button><button data-grade="neon">Neon</button><button data-grade="natural">Original</button>
        </div>
      </section>
      <p id="status" role="status"></p>
    </aside>
  </main>
</body>
</html>
